services:
  gsbs-server:
    image: dendlomm/gsbs-server:latest
    container_name: gsbs-server
    restart: unless-stopped
    expose:
      - "8080"
    # No required environment variables. On first run the server generates a
    # session secret into the data volume and opens a web setup wizard where
    # you create the admin account and choose options. Everything below is an
    # optional override — see .env.example / docs/INSTALL.md.
    environment:
      GSBS_DB: /app/data/gsbs.db
      GSBS_SAVE_ROOT: /app/data/gamesaves
    volumes:
      - gsbs-data:/app/data
    # Entrypoint drops root -> uid 1000 via su-exec, which no-new-privileges permits.
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    security_opt:
      - no-new-privileges:true
    image: caddy:2-alpine
    container_name: gsbs-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docs/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gsbs-server:
        condition: service_healthy

volumes:
  gsbs-data:
  caddy-data:
  caddy-config:
