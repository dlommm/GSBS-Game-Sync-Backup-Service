<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <title>{{.StatusCode}} — GSBS</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme-boot.js"></script>
</head>
<body class="auth-page">
  <main id="main-content" class="auth-card error-card" role="main">
    <img src="/static/logo.png" alt="GSBS" class="auth-logo">
    <p class="error-code" aria-hidden="true">{{.StatusCode}}</p>
    <h1>{{.Title}}</h1>
    <p class="subtitle">{{.Message}}</p>
    <div class="error-actions">
      <a class="btn-primary" href="/dashboard">Back to dashboard</a>
      <a class="btn-ghost" href="/login">Sign in</a>
    </div>
  </main>
</body>
</html>
