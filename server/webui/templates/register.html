<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — GSBS</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-page">
  <main id="main-content" class="auth-card" role="main">
    <img src="/static/logo.png" alt="GSBS" class="auth-logo">
    <h1>Create account</h1>
    <p class="subtitle">Register for GSBS</p>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/register" class="auth-form">
      <input type="hidden" name="csrf" value="{{.CSRFToken}}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="new-password">
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password">
      <button type="submit">Register</button>
    </form>
    <section class="auth-help">
      <h2>Initial Configuration</h2>
      <ol>
        <li>Create your first account here, then sign in.</li>
        <li>Open <strong>Admin → Settings</strong> to review cron and first-start sync options.</li>
        <li>Open <strong>Admin → PCGW</strong> and start the initial incremental sync.</li>
      </ol>
    </section>
    <p class="auth-footer"><a href="/login">Back to sign in</a></p>
  </main>
</body>
</html>
