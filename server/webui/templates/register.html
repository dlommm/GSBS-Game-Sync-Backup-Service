<!-- Register: new account form; redirects to login on success. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — GSBS</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <main id="main-content" class="auth-card" role="main" aria-label="Create account">
    <img src="/static/logo.png" alt="GSBS" class="auth-logo">
    <h1>Create account</h1>
    <p class="subtitle">Register for Game Sync &amp; Backup</p>
    {{if .Error}}
    <p class="error" role="alert" aria-live="assertive">{{.Error}}</p>
    {{end}}
    {{if .AllowRegister}}
    <form method="post" action="/register" class="auth-form" aria-label="Registration form">
      <input type="hidden" name="csrf" value="{{.CSRFToken}}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username" aria-required="true">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="new-password" aria-required="true">
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password" aria-required="true">
      <button type="submit">Register</button>
    </form>
    {{else}}
    <div class="alert alert-info">Registration is currently disabled by the server administrator. Contact your admin if you need an account.</div>
    {{end}}
    <p class="auth-footer">Already have an account? <a href="/login">Sign in</a></p>
  </main>
</body>
</html>
