{{template "layout" .}}
{{define "enable_2fa_title"}}Enable 2FA — GSBS{{end}}
{{define "enable_2fa_content"}}
<section class="panel">
  <div class="panel-header"><h2>Scan QR code</h2></div>
  <div class="u-pad-foot-center">
    {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
    <img class="u-block-center" src="{{.QRDataURL}}" alt="2FA QR code" width="200" height="200">
    <p class="cell-muted">Or enter manually: <code class="code-inline">{{.Secret}}</code></p>
    <form method="post" action="/dashboard/settings/2fa/confirm" class="auth-form u-maxw-16">
      <input type="hidden" name="csrf" value="{{.CSRFToken}}">
      <label for="code">Verification code</label>
      <input id="code" name="code" type="text" inputmode="numeric" required autofocus>
      <button type="submit">Confirm and enable</button>
    </form>
  </div>
</section>
{{end}}
