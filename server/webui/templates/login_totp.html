<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-factor authentication — GSBS</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-page">
  <main class="auth-card" role="main">
    <h1>Authenticator code</h1>
    <p class="subtitle">Enter the code from your authenticator app</p>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/login/totp" class="auth-form">
      <input type="hidden" name="csrf" value="{{.CSRFToken}}">
      <label for="code">Code</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" required autofocus>
      <button type="submit">Verify</button>
    </form>
  </main>
</body>
</html>
