{{define "partials/dashboard_activity.html"}}
{{if .StoreError}}
<p class="panel-empty u-warn" role="alert">Activity could not be loaded.
  <a href="" hx-get="/dashboard/partial/activity" hx-target="closest #activity-feed" hx-swap="innerHTML">Retry</a>
</p>
{{else if .Entries}}
<ul class="timeline">
  {{range .Entries}}
  {{template "partials/timeline_item.html" .}}
  {{end}}
</ul>
{{else}}
<p class="panel-empty">No recent activity.</p>
{{end}}
{{end}}
