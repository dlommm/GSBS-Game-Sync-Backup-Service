{{define "partials/admin_pcgw_wipe_modal.html"}}
<div class="modal fade" id="wipeModal" tabindex="-1" aria-labelledby="wipeModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="wipeModalLabel">Confirm PCGW Wipe</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="wipePreflight" class="config-grid pcgw-wipe-preflight">
          <div class="config-item"><span class="config-key">Loading...</span><span class="config-val"></span></div>
        </div>
        <p class="pcgw-wipe-warning">This action is <strong>irreversible</strong>. Type <code>WIPE PCGW</code> to confirm:</p>
        <input type="text" id="wipeConfirmInput" class="search-input pcgw-wipe-input" placeholder="WIPE PCGW">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <form id="wipeForm" method="post" action="/admin/pcgw/wipe" class="inline-form">
          <input type="hidden" name="csrf" value="{{$.CSRFToken}}">
          <input type="hidden" id="wipeModeInput" name="mode" value="">
          <button type="submit" id="wipeSubmitBtn" class="btn btn-danger" disabled>Wipe</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
window.showWipeModal = function showWipeModal(mode) {
  const modeInput = document.getElementById("wipeModeInput");
  const confirmInput = document.getElementById("wipeConfirmInput");
  const submitBtn = document.getElementById("wipeSubmitBtn");
  const preflight = document.getElementById("wipePreflight");
  if (!modeInput || !confirmInput || !submitBtn || !preflight) {
    return;
  }

  modeInput.value = mode;
  confirmInput.value = "";
  submitBtn.disabled = true;
  preflight.innerHTML = '<div class="config-item"><span class="config-key">Loading...</span><span class="config-val"></span></div>';

  fetch("/admin/pcgw/wipe-preflight")
    .then((r) => r.json())
    .then((d) => {
      let html = "";
      html += `<div class="config-item"><span class="config-key">PCGW games</span><span class="config-val">${d.pcgw_games}</span></div>`;
      html += `<div class="config-item"><span class="config-key">PCGW game data rows</span><span class="config-val">${d.pcgw_game_data}</span></div>`;
      html += `<div class="config-item"><span class="config-key">Section rows</span><span class="config-val">${d.pcgw_sections}</span></div>`;
      html += `<div class="config-item"><span class="config-key">Metadata rows</span><span class="config-val">${d.pcgw_metadata}</span></div>`;
      if (mode === "mirror_and_manifest") {
        html += `<div class="config-item"><span class="config-key">Save locations (pcgw)</span><span class="config-val pcgw-danger-text">${d.game_save_locations}</span></div>`;
      }
      preflight.innerHTML = html;
    })
    .catch(() => {
      preflight.innerHTML = '<p class="cell-muted">Could not load preflight counts.</p>';
    });

  const modal = new bootstrap.Modal(document.getElementById("wipeModal"));
  modal.show();

  confirmInput.oninput = () => {
    submitBtn.disabled = confirmInput.value !== "WIPE PCGW";
  };
};
</script>
{{end}}
