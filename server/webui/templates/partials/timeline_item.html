{{define "partials/timeline_item.html"}}
<li class="timeline-item" data-cat="{{auditCategory .Action}}">
  <span class="timeline-dot tone-{{auditTone .Action}}" aria-hidden="true"></span>
  <div class="timeline-time" title="{{.At}}">{{formatTime .At}}</div>
  <div class="timeline-action">{{auditLabel .Action}}</div>
  {{if .Details}}<div class="timeline-details">{{.Details}}</div>{{end}}
</li>
{{end}}
