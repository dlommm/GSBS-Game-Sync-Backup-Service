{{define "partials/admin_shell.html"}}
<nav class="admin-mobile-nav" aria-label="Admin">
  <a href="/admin" {{if eq .AdminNav "overview"}}class="active"{{end}}>Overview</a>
  <a href="/admin/users" {{if eq .AdminNav "users"}}class="active"{{end}}>Users</a>
