<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GSBS</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-page">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <main id="main-content" class="auth-card" role="main">
    <img src="/static/logo.png" alt="GSBS" class="auth-logo">
    <h1>Game Sync &amp; Backup</h1>
    <p class="subtitle">Sign in to your account</p>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/login" class="auth-form">
      <input type="hidden" name="csrf" value="{{.CSRFToken}}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="username">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
    {{if .AllowRegister}}<p class="auth-footer">Don't have an account? <a href="/register">Register</a></p>{{end}}
  </main>
</body>
</html>
