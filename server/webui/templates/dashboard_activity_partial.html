{{if .Entries}}
<ul class="activity-feed">
  {{range .Entries}}
  <li class="activity-item">
    <span class="activity-time cell-muted">{{formatTime .At}}</span>
    <span class="activity-action">{{.Action}}</span>
    {{if .Details}}<span class="activity-details cell-muted">{{.Details}}</span>{{end}}
  </li>
  {{end}}
</ul>
{{else}}
<p class="panel-empty">No recent activity.</p>
{{end}}
