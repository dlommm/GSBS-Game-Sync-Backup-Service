run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
    - errorlint
    - bodyclose
    - noctx
    - gosimple

linters-settings:
  errcheck:
    exclude-functions: '.*\\.Close,.*\\.Rollback,fmt\\.Fprint,fmt\\.Fprintf,fmt\\.Sscanf,io\\.Copy,os\\.Remove,w\\.Write'
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - cmd
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: server/store/sqlite\.go
      linters:
        - errcheck
    - path: server/store/pcgw\.go
      linters:
        - errcheck
    - path: server/main\.go
      linters:
        - errcheck
    - path: server/metrics/
      linters:
        - errcheck
    - path: server/api/handler\.go
      linters:
        - errcheck
    - path: server/webui/
      linters:
        - errcheck
    - path: pkg/pcgw/
      linters:
        - errcheck
        - noctx
    - path: pkg/paths/steam_vdf\.go
      linters:
        - errcheck
    - path: client/list\.go|client/login\.go|client/manifest\.go|client/setup_server\.go|client/update\.go|client/validate\.go
      linters:
        - errcheck
        - noctx
        - gosimple
    - path: client/tray_stub\.go|client/tray_notify\.go|client/single_instance\.go|client/main\.go
      linters:
        - unused
    - path: client/discovery\.go
      text: "manifestGameIDSet"
    - path: client/config\.go
      text: "parseDurationFlex"
    - path: client/tray_actions\.go
      text: "restoreSaveVersion"
    - path: pkg/paths/resolve_test\.go
      linters:
        - staticcheck
    - path: client/run_sync\.go
      linters:
        - staticcheck
    - path: server/auth/auth_test\.go
      linters:
        - errorlint
    - path: pkg/paths/resolve\.go
      linters:
        - ineffassign
