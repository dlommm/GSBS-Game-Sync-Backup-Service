services:
  gsbs-server:
    image: dendlomm/gsbs-server:latest
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      GSBS_ADDR: ":8080"
      GSBS_DB: /app/data/gsbs.db
      GSBS_SESSION_SECRET: ${GSBS_SESSION_SECRET:?set GSBS_SESSION_SECRET}
    volumes:
      - gsbs-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      gsbs-server:
        condition: service_healthy

volumes:
  gsbs-data:
