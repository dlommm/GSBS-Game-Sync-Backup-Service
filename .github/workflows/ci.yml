name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  actions: read
  contents: read

jobs:
  resolve-runner:
    uses: ./.github/workflows/runner-resolve.yml

  test:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Linux tray build deps
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev pkg-config gcc
      - name: Test
        run: go test ./server/... ./pkg/... ./client/...
      - name: Build WebUI CSS
        run: ./script/build-webui.sh
      - name: Build server
        run: go build -o gsbs-server ./server
      - name: Build client
        run: go build -o gsbs-client ./client

  build-linux:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install Linux tray build deps
        run: sudo apt-get update && sudo apt-get install -y libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build WebUI CSS
        run: ./script/build-webui.sh
      - name: Build release binaries
        env:
          VERSION: ci-${{ github.sha }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: "1970-01-01T00:00:00Z"
          BUILD_WEBUI: "0"
        run: ./script/build.sh "$VERSION" dist linux-amd64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build WebUI CSS
        shell: bash
        run: ./script/build-webui.sh
      - name: Build release binaries
        shell: bash
        env:
          VERSION: ci-${{ github.sha }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: "1970-01-01T00:00:00Z"
          BUILD_WEBUI: "0"
        run: ./script/build.sh "$VERSION" dist windows-amd64

  lint:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m

  docker:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: dendlomm/gsbs-server:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            BUILD_DATE=1970-01-01T00:00:00Z
            COMMIT=${{ github.sha }}
