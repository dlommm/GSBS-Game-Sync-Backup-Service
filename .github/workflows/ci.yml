name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  actions: read
  contents: read

jobs:
  resolve-runner:
    uses: ./.github/workflows/runner-resolve.yml
    secrets: inherit

  test:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install build deps (cgo for go-sqlite3 and -race)
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Test
        run: go test -race -coverprofile=coverage.out ./server/... ./pkg/... ./client/...
      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
      - name: Upload coverage to Codecov
        # Tokenless upload works for public repos; failures don't block CI.
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: coverage.out
      - name: Build WebUI CSS
        run: ./script/build-webui.sh
      - name: Build server
        run: go build -o gsbs-server ./server
      - name: Build client
        run: go build -o gsbs-client ./client
      - name: Build client (Flatpak parity)
        # The Flatpak build runs with CGO_ENABLED=0 (pure-Go D-Bus tray) but its
        # workflow only triggers on flatpak/** changes; this catches code changes
        # that would break it.
        run: CGO_ENABLED=0 GOOS=linux go build -o /dev/null ./client
      - name: govulncheck
        # Blocking: a reachable ("called") known-vulnerable symbol fails CI.
        # Pinned tool version keeps runs reproducible (no floating @latest).
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  test-windows:
    needs: resolve-runner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Test
        # windows-latest ships mingw gcc, so the race detector works here too.
        run: go test -race ./server/... ./pkg/... ./client/...

  build-linux:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build WebUI CSS
        run: ./script/build-webui.sh
      - name: Build release binaries
        env:
          VERSION: ci-${{ github.sha }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: "1970-01-01T00:00:00Z"
          BUILD_WEBUI: "0"
        run: ./script/build.sh "$VERSION" dist linux-amd64

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Build macOS client + server (native cgo)
        run: |
          go build -o /dev/null ./client
          go build -o /dev/null ./server

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build WebUI CSS
        shell: bash
        run: ./script/build-webui.sh
      - name: Build release binaries
        shell: bash
        env:
          VERSION: ci-${{ github.sha }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: "1970-01-01T00:00:00Z"
          BUILD_WEBUI: "0"
        run: ./script/build.sh "$VERSION" dist windows-amd64

  lint:
    needs: resolve-runner
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Install build deps (cgo for go-sqlite3 typechecking)
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
