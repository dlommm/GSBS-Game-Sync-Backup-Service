# Reusable workflow: pick self-hosted when online, else GitHub-hosted Linux.
# Called by ci.yml and release.yml. The resolve job always runs on ubuntu-latest
# so downstream jobs never queue on an offline self-hosted runner.
#
# Detection (first match wins):
#   1. GSBS_USE_SELF_HOSTED=false  → ubuntu-latest
#   2. GSBS_RUNNER_ONLINE=true       → self-hosted (set by script/ci-runner-online.sh on the runner host)
#   3. GSBS_RUNNER_CHECK_TOKEN set   → GitHub API list runners (PAT with repo scope)
#   4. otherwise                     → ubuntu-latest
name: Resolve runner

on:
  workflow_call:
    outputs:
      linux:
        description: Runner label for Linux jobs (self-hosted or ubuntu-latest)
        value: ${{ jobs.resolve.outputs.linux }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
    steps:
      - name: Pick Linux runner
        id: pick
        env:
          RUNNER_CHECK_TOKEN: ${{ secrets.GSBS_RUNNER_CHECK_TOKEN }}
        uses: actions/github-script@v8
        with:
          script: |
            const forceGithub = '${{ vars.GSBS_USE_SELF_HOSTED }}' === 'false';
            const runnerOnlineVar = '${{ vars.GSBS_RUNNER_ONLINE }}' === 'true';
            let linux = 'ubuntu-latest';

            if (forceGithub) {
              core.notice('GSBS_USE_SELF_HOSTED=false — using ubuntu-latest');
            } else if (runnerOnlineVar) {
              linux = 'self-hosted';
              core.notice('GSBS_RUNNER_ONLINE=true — using self-hosted');
            } else if (process.env.RUNNER_CHECK_TOKEN) {
              try {
                const octokit = github.getOctokit(process.env.RUNNER_CHECK_TOKEN);
                const { data } = await octokit.rest.actions.listSelfHostedRunnersForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 100,
                });
                const online = data.runners.some((r) => r.status === 'online');
                if (online) {
                  linux = 'self-hosted';
                  core.notice(`Self-hosted runner online — using self-hosted (${data.runners.filter((r) => r.status === 'online').length} online)`);
                } else {
                  core.notice('No online self-hosted runner — falling back to ubuntu-latest');
                }
              } catch (err) {
                core.warning(`Runner API check failed (${err.message}) — falling back to ubuntu-latest`);
              }
            } else {
              core.notice('Self-hosted not marked online (set GSBS_RUNNER_ONLINE=true via script/ci-runner-online.sh on the runner host, or add GSBS_RUNNER_CHECK_TOKEN secret) — using ubuntu-latest');
            }

            core.setOutput('linux', linux);
