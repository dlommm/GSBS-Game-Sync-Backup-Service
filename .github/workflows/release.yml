name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.14)"
        required: true
        type: string

permissions:
  contents: write

env:
  DOCKERHUB_IMAGE: dendlomm/gsbs-server
  GO_VERSION: "1.25"
  LINUX_CLIENT_DEPS: libayatana-appindicator3-dev libgtk-3-dev pkg-config gcc

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux tray build deps
        run: sudo apt-get update && sudo apt-get install -y $LINUX_CLIENT_DEPS
      - name: Test
        run: go test ./server/... ./pkg/... ./client/...

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Linux tray build deps
        run: sudo apt-get update && sudo apt-get install -y $LINUX_CLIENT_DEPS
      - name: Build binaries
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: ./script/build.sh "$VERSION" dist linux-amd64
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      - name: Build .deb
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: ./script/packaging/linux/build-deb.sh dist "$VERSION"
      - name: Build AppImage
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: ./script/packaging/linux/build-appimage.sh dist "$VERSION"
      - name: Generate release manifests
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
          RELEASED_AT: ${{ github.event.head_commit.timestamp }}
        run: ./script/release-assets.sh "$VERSION" dist
      - name: Upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/gsbs-server-linux-amd64
            dist/gsbs-client-linux-amd64
            dist/gsbs-client_*.deb
            dist/gsbs-client-*-x86_64.AppImage
            dist/SHA256SUMS
            dist/latest-client.json

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build binaries
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: ./script/build.sh "$VERSION" dist windows-amd64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          $ver = $env:VERSION -replace '^v',''
          $work = Join-Path $PWD "dist/inno-work"
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work | Out-Null
          Copy-Item "dist/gsbs-client-windows-amd64.exe" (Join-Path $work "gsbs-client-windows-amd64.exe")
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "/DSourceDir=$work" "/O$PWD\dist" "$PWD\script\packaging\windows\gsbs-client.iss"
      - name: Generate release manifests
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: ./script/release-assets.sh "$VERSION" dist
      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/gsbs-server-windows-amd64.exe
            dist/gsbs-client-windows-amd64.exe
            dist/gsbs-client-setup-*.exe
            dist/SHA256SUMS
            dist/latest-client.json

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.ver.outputs.value }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            COMMIT=${{ github.sha }}

  release:
    needs: [build-linux, build-windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist
      - name: Download windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: Merge SHA256SUMS and latest-client.json
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: bash script/release-assets.sh "$VERSION" dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/gsbs-server-windows-amd64.exe
            dist/gsbs-client-windows-amd64.exe
            dist/gsbs-server-linux-amd64
            dist/gsbs-client-linux-amd64
            dist/gsbs-client-setup-*.exe
            dist/gsbs-client_*.deb
            dist/gsbs-client-*-x86_64.AppImage
            dist/SHA256SUMS
            dist/latest-client.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
