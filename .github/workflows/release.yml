name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: read

env:
  DOCKERHUB_IMAGE: dendlomm/gsbs-server
  GO_VERSION: "1.25"
  LINUX_CLIENT_DEPS: libayatana-appindicator3-dev libgtk-3-dev pkg-config gcc file

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      value: ${{ steps.ver.outputs.value }}
      commit_date: ${{ steps.ver.outputs.commit_date }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          RAW="${RAW#v}"
          echo "tag=v${RAW}" >> "$GITHUB_OUTPUT"
          echo "value=${RAW}" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

  resolve-runner:
    needs: version
    uses: ./.github/workflows/runner-resolve.yml
    secrets: inherit

  test:
    needs: [version, resolve-runner]
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux tray build deps
        run: sudo apt-get update && sudo apt-get install -y $LINUX_CLIENT_DEPS
      - name: Test
        run: go test -race ./server/... ./pkg/... ./client/...

  lint:
    needs: [version, resolve-runner]
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Linux tray build deps
        run: sudo apt-get update && sudo apt-get install -y $LINUX_CLIENT_DEPS
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  build-linux:
    needs: [version, resolve-runner, test, lint]
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Linux tray build deps
        run: sudo apt-get update && sudo apt-get install -y $LINUX_CLIENT_DEPS
      - name: Build binaries
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: ./script/build.sh "$VERSION" dist linux-amd64
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      - name: Build .deb
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: ./script/packaging/linux/build-deb.sh dist "$VERSION"
      - name: Build AppImage
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: ./script/packaging/linux/build-appimage.sh dist "$VERSION"
      - name: Verify AppImage in dist
        run: test -f "dist/gsbs-client-${{ needs.version.outputs.value }}-x86_64.AppImage"
      - name: Generate release manifests
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          RELEASED_AT: ${{ needs.version.outputs.commit_date }}
        run: ./script/release-assets.sh "$VERSION" dist
      - name: Upload linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: |
            dist/gsbs-server-linux-amd64
            dist/gsbs-client-linux-amd64
            dist/gsbs-client_*.deb
            dist/gsbs-client-${{ needs.version.outputs.value }}-x86_64.AppImage
            dist/SHA256SUMS
            dist/latest-client.json

  build-windows:
    needs: [version, test, lint]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install goversioninfo (embeds exe icon + version)
        shell: bash
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build binaries
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: ./script/build.sh "$VERSION" dist windows-amd64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build client installer
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          $ver = $env:VERSION -replace '^v',''
          $work = Join-Path $PWD "dist/inno-work"
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work | Out-Null
          Copy-Item "dist/gsbs-client-windows-amd64.exe" (Join-Path $work "gsbs-client-windows-amd64.exe")
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "/DSourceDir=$work" "/O$PWD\dist" "$PWD\script\packaging\windows\gsbs-client.iss"
      - name: Build server installer
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          $ver = $env:VERSION -replace '^v',''
          $work = Join-Path $PWD "dist/inno-work-server"
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work | Out-Null
          Copy-Item "dist/gsbs-server-windows-amd64.exe" (Join-Path $work "gsbs-server-windows-amd64.exe")
          Copy-Item "script/packaging/windows/gsbs-server-launcher.cmd" (Join-Path $work "gsbs-server-launcher.cmd")
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$ver" "/DSourceDir=$work" "/O$PWD\dist" "$PWD\script\packaging\windows\gsbs-server.iss"
      - name: Generate release manifests
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: ./script/release-assets.sh "$VERSION" dist
      - name: Upload windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: |
            dist/gsbs-server-windows-amd64.exe
            dist/gsbs-client-windows-amd64.exe
            dist/gsbs-client-setup-*.exe
            dist/gsbs-server-setup-*.exe
            dist/SHA256SUMS
            dist/latest-client.json

  build-flatpak:
    needs: [version, test, lint]
    runs-on: ubuntu-latest
    env:
      HAS_GPG: ${{ secrets.GSBS_GPG_PRIVATE != '' }}
      HAS_DEPLOY: ${{ secrets.GSBS_FLATPAK_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.golang//24.08
      - name: Validate AppStream + desktop file
        run: |
          appstreamcli validate --no-net flatpak/io.github.dlommm.GSBS.metainfo.xml
          desktop-file-validate flatpak/io.github.dlommm.GSBS.desktop
      - name: Build Flatpak
        run: flatpak/build-flatpak.sh "${{ needs.version.outputs.tag }}"
      - name: Import GPG signing key
        if: env.HAS_GPG == 'true'
        run: echo "${{ secrets.GSBS_GPG_PRIVATE }}" | gpg --batch --import
      - name: Sign and assemble static repo
        if: env.HAS_GPG == 'true'
        env:
          GSBS_GPG_KEY: ${{ secrets.GSBS_GPG_KEY_ID }}
          GSBS_REPO_URL: https://dlommm.github.io/gsbs-flatpak/repo
        run: flatpak/update-repo.sh
      - name: Publish to GitHub Pages repo (dlommm/gsbs-flatpak)
        if: env.HAS_GPG == 'true' && env.HAS_DEPLOY == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.GSBS_FLATPAK_DEPLOY_KEY }}" > ~/.ssh/flatpak_deploy
          chmod 600 ~/.ssh/flatpak_deploy
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/flatpak_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 --branch gh-pages git@github.com:dlommm/gsbs-flatpak.git pages
          rm -rf pages/repo
          cp -r flatpak/repo pages/repo
          cd pages
          git config user.name "gsbs-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "Update Flatpak repo for ${{ needs.version.outputs.tag }}" || echo "no changes"
          git push origin HEAD:gh-pages

  docker:
    needs: [version, resolve-runner, test, lint, build-linux, build-windows]
    runs-on: ${{ needs.resolve-runner.outputs.linux }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.version.outputs.value }}
            ${{ env.DOCKERHUB_IMAGE }}:latest
          build-args: |
            VERSION=${{ needs.version.outputs.value }}
            BUILD_DATE=${{ needs.version.outputs.commit_date }}
            COMMIT=${{ github.sha }}

  release:
    needs: [version, build-linux, build-windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download linux artifacts
        uses: actions/download-artifact@v6
        with:
          name: release-linux
          path: dist
      - name: Download windows artifacts
        uses: actions/download-artifact@v6
        with:
          name: release-windows
          path: dist
      - name: Merge SHA256SUMS and latest-client.json
        env:
          VERSION: ${{ needs.version.outputs.tag }}
          REQUIRE_COMPLETE_MANIFEST: "1"
        run: bash script/release-assets.sh "$VERSION" dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/gsbs-server-windows-amd64.exe
            dist/gsbs-client-windows-amd64.exe
            dist/gsbs-server-linux-amd64
            dist/gsbs-client-linux-amd64
            dist/gsbs-client-setup-*.exe
            dist/gsbs-server-setup-*.exe
            dist/gsbs-client_*.deb
            dist/gsbs-client-${{ needs.version.outputs.value }}-x86_64.AppImage
            dist/SHA256SUMS
            dist/latest-client.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
