{{define "partials/topbar.html"}}
<header class="gbar topbar" role="banner">
  <a class="gbar-brand" href="/dashboard" aria-label="GSBS Client home">
    <img src="/static/favicon.png" alt="" width="30" height="30">
    <span>GSBS</span>
  </a>
  <nav class="gbar-nav gbar-nav-scroll" role="navigation" aria-label="Main navigation">
    {{$nav := .NavActive}}
    <a href="/dashboard"     {{if eq $nav "dashboard"}}class="on" aria-current="page"{{end}}>Status</a>
    <a href="/games"         {{if eq $nav "games"}}class="on" aria-current="page"{{end}}>Games</a>
    <a href="/insights"      {{if eq $nav "insights"}}class="on" aria-current="page"{{end}}>Insights</a>
    <a href="/quick-actions" {{if eq $nav "quick-actions"}}class="on" aria-current="page"{{end}}>Actions</a>
    <a href="/settings"      {{if eq $nav "settings"}}class="on" aria-current="page"{{end}}>Settings</a>
    <a href="/logs"          {{if eq $nav "logs"}}class="on" aria-current="page"{{end}}>Logs</a>
    <a href="/help"          {{if eq $nav "help"}}class="on" aria-current="page"{{end}}>Help</a>
    <a href="/about"         {{if eq $nav "about"}}class="on" aria-current="page"{{end}}>About</a>
  </nav>
  <div class="gbar-right">
    <button type="button" class="gbar-icon theme-toggle" data-action="toggle-theme" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
      <span class="theme-toggle-dark" aria-hidden="true"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7Z"/></svg></span>
      <span class="theme-toggle-light" aria-hidden="true"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M12.6 3.4l-1 1M4.4 11.6l-1 1"/></svg></span>
    </button>
  </div>
</header>
{{end}}
