{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSBS — {{.Title}}</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="app-shell">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  {{template "partials/topbar.html" .}}
  <main id="main-content" class="page-content" role="main">
    {{template "partials/alerts.html" .}}
    {{block "content" .}}{{end}}
  </main>
  {{block "scripts" .}}{{end}}
  <div id="toast-container" aria-live="polite" aria-atomic="true" style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;display:flex;flex-direction:column;gap:0.5rem;max-width:24rem;"></div>
  <script src="/static/toast.js"></script>
</body>
</html>
{{end}}
