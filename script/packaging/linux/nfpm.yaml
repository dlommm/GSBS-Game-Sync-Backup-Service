name: gsbs-client
arch: amd64
platform: linux
version: "${VERSION}"
section: utils
priority: optional
maintainer: GSBS <https://github.com/dlommm/GSBS--Game-Sync---Backup-Service->
description: |
  GSBS (Game Sync & Backup Service) client — sync game saves to a central server.
  Requires a running GSBS server; configure via the tray menu after first launch.
depends:
  - libayatana-appindicator3-1 | libappindicator3-1
  - xdg-utils
contents:
  - src: gsbs-client-linux-amd64
    dst: /usr/bin/gsbs-client
    file_info:
      mode: 0755
  - src: gsbs-client.desktop
    dst: /usr/share/applications/gsbs-client.desktop
    file_info:
      mode: 0644
  - src: gsbs-client.png
    dst: /usr/share/icons/hicolor/32x32/apps/gsbs-client.png
    file_info:
      mode: 0644
