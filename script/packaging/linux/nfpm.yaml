name: gsbs-client
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: utils
priority: optional
maintainer: GSBS <https://github.com/dlommm/GSBS--Game-Sync---Backup-Service->
description: |
  GSBS (Game Sync & Backup Service) client — sync game saves to a central server.
  Requires a running GSBS server; configure via the tray menu after first launch.
homepage: https://github.com/dlommm/GSBS--Game-Sync---Backup-Service-
license: MIT
# No appindicator library dependency: the tray is pure-Go D-Bus
# (StatusNotifierItem). GNOME desktops need an SNI host such as the
# AppIndicator extension for the icon to show — documented in INSTALL.md.
depends:
  - xdg-utils
scripts:
  postinstall: postinstall.sh
  postremove: postremove.sh
contents:
  - src: gsbs-client
    dst: /usr/bin/gsbs-client
    file_info:
      mode: 0755
  - src: io.github.dlommm.GSBS.desktop
    dst: /usr/share/applications/io.github.dlommm.GSBS.desktop
    file_info:
      mode: 0644
  - src: io.github.dlommm.GSBS.metainfo.xml
    dst: /usr/share/metainfo/io.github.dlommm.GSBS.metainfo.xml
    file_info:
      mode: 0644
  - src: icons/16.png
    dst: /usr/share/icons/hicolor/16x16/apps/io.github.dlommm.GSBS.png
    file_info:
      mode: 0644
  - src: icons/32.png
    dst: /usr/share/icons/hicolor/32x32/apps/io.github.dlommm.GSBS.png
    file_info:
      mode: 0644
  - src: icons/48.png
    dst: /usr/share/icons/hicolor/48x48/apps/io.github.dlommm.GSBS.png
    file_info:
      mode: 0644
  - src: icons/64.png
    dst: /usr/share/icons/hicolor/64x64/apps/io.github.dlommm.GSBS.png
    file_info:
      mode: 0644
  - src: icons/128.png
    dst: /usr/share/icons/hicolor/128x128/apps/io.github.dlommm.GSBS.png
    file_info:
      mode: 0644
  - src: icons/256.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.dlommm.GSBS.png
    file_info:
      mode: 0644
